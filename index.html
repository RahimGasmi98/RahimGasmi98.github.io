<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J3AN — اكتشف أفضل الأماكن</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root{
      --green:#16a34a;
      --green-2:#22c55e;
      --ease:ease-in-out;
      --fast:.2s;
      --mid:.3s;
      --slow:.4s;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: #fff;
      color: #1e293b;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ══════ Navbar ══════ */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 18px;
      background: #fff;
      border-bottom: 1px solid #eee;
      box-shadow: 0 2px 12px rgba(0,0,0,.04);
    }

    .logo {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .logo-img {
      height: 44px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .nav-center {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f5f5f5;
      border: 1px solid #e5e5e5;
      border-radius: 40px;
      padding: 6px 8px;
      cursor: pointer;
      transition: box-shadow var(--fast) var(--ease), transform var(--fast) var(--ease);
    }

    .nav-center:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,.10);
      transform: translateY(-1px);
    }

    .search-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--green-2), var(--green));
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 16px;
      flex-shrink: 0;
    }

    .search-text {
      padding: 0 12px;
      font-size: 14px;
      font-weight: 700;
      color: #333;
    }

    .search-sub {
      font-size: 12px;
      color: #999;
      font-weight: 400;
    }

    /* ══════ Map Overlay ══════ */
    .map-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #fff;
      display: none;
      flex-direction: column;
      animation: fadeIn .3s var(--ease);
    }

    .map-overlay.active { display: flex; }

    .map-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid #eee;
      background: #fff;
    }

    .map-header h2 {
      font-size: 18px;
      font-weight: 800;
      color: #111;
    }

    .map-close-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #f5f5f5;
      border: 1px solid #e5e5e5;
      font-size: 18px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background var(--fast) var(--ease);
    }

    .map-close-btn:hover { background: #eee; }

    .map-overlay iframe {
      flex: 1;
      width: 100%;
      border: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ══════ Categories ══════ */
    .categories-bar {
      margin-top: 80px;
      padding: 16px 24px 0;
      border-bottom: 1px solid #f0f0f0;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .categories-bar::-webkit-scrollbar { display: none; }

    .cat-list {
      display: inline-flex;
      gap: 28px;
      padding-bottom: 12px;
    }

    .cat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      opacity: .6;
      transition: opacity .2s var(--ease);
      border-bottom: 2px solid transparent;
      padding-bottom: 8px;
      min-width: 56px;
    }

    .cat-item:hover, .cat-item.active {
      opacity: 1;
      border-bottom-color: #111;
    }

    .cat-icon { font-size: 24px; }
    .cat-label {
      font-size: 11px;
      font-weight: 600;
      color: #555;
      white-space: nowrap;
    }

    .content { padding: 0 0 60px; }

    .section-row { padding: 32px 0 0; }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px 16px;
    }

    .section-title {
      font-size: 22px;
      font-weight: 800;
      color: #111;
    }

    .section-see-all {
      font-size: 14px;
      font-weight: 700;
      color: var(--green);
      text-decoration: underline;
      cursor: pointer;
    }

    .scroll-row {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding: 0 28px 8px;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .scroll-row::-webkit-scrollbar { display: none; }

    .place-card {
      flex: 0 0 280px;
      scroll-snap-align: start;
      border-radius: 16px;
      overflow: hidden;
      background: #fff;
      cursor: pointer;
      transition: transform var(--mid) var(--ease), box-shadow var(--mid) var(--ease);
      will-change: transform;
    }

    .place-card:hover {
      transform: translateY(-4px) scale(1.015);
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
    }

    .card-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 16px;
      transition: transform var(--mid) var(--ease);
    }

    .place-card:hover .card-img { transform: scale(1.02); }

    .card-img-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
    }

    .card-fav {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,.85);
      display: grid;
      place-items: center;
      font-size: 16px;
      cursor: pointer;
      transition: transform .2s;
      border: none;
      z-index: 2;
    }

    .card-fav:hover { transform: scale(1.15); }
    .card-fav.liked { color: #ef4444; }

    .card-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #fff;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }

    .card-body { padding: 12px 4px 0; }

    .card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-name {
      font-size: 15px;
      font-weight: 700;
      color: #111;
    }

    .card-rating {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 14px;
      font-weight: 600;
    }

    .star { color: #111; font-size: 12px; }

    .card-type { font-size: 13px; color: #888; margin-top: 2px; }
    .card-price { font-size: 14px; color: #333; margin-top: 4px; }
    .card-price b { font-weight: 800; }

    /* ══════ Popup ══════ */
    .details-modal{
      position: fixed;
      inset: 0;
      z-index: 400;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .details-modal.active { display: flex; }

    .details-backdrop{
      position: absolute;
      inset: 0;
      background: rgba(15,23,42,.45);
      opacity: 0;
      transition: opacity var(--mid) var(--ease);
    }

    .details-dialog{
      position: relative;
      width: min(100%, 420px);
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,.2);
      opacity: 0;
      transform: translateY(10px) scale(.96);
      transition: opacity var(--mid) var(--ease), transform var(--mid) var(--ease);
    }

    .details-modal.active .details-backdrop { opacity: 1; }
    .details-modal.active .details-dialog {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .details-close{
      position: absolute;
      left: 10px;
      top: 10px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      cursor: pointer;
      font-size: 16px;
    }

    .details-title{
      font-size: 20px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 10px;
      padding-left: 40px;
    }

    .details-list{
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
      font-size: 14px;
      color: #334155;
    }

    .details-list b{ color: #0f172a; }

    .details-map-btn{
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 12px;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      background: linear-gradient(135deg, var(--green-2), var(--green));
      transition: transform var(--fast) var(--ease), filter var(--fast) var(--ease);
    }

    .details-map-btn:hover{
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    /* ══════ Footer ══════ */
    footer {
      text-align: center;
      padding: 32px 24px;
      border-top: 1px solid #eee;
      color: #999;
      font-size: 13px;
    }

    footer span { color: var(--green); font-weight: 700; }

    .support-link{
      display: inline-block;
      margin-top: 10px;
      color: var(--green);
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      border: 1px solid var(--green);
      padding: 8px 14px;
      border-radius: 10px;
      transition: all .2s var(--ease);
    }

    .support-link:hover{
      background: var(--green);
      color: #fff;
    }

    @media (max-width: 640px) {
      nav { padding: 10px 12px; }
      .logo-img { height: 36px; }
      .search-text { font-size: 13px; }
      .place-card { flex: 0 0 240px; }
      .card-img { height: 170px; }
      .section-title { font-size: 18px; }
      .section-header { padding: 0 16px 12px; }
      .scroll-row { padding: 0 16px 8px; gap: 12px; }
      .categories-bar { padding: 12px 16px 0; }
      .cat-list { gap: 20px; }
    }
  </style>
</head>
<body>

  <!-- ══════ Navbar ══════ -->
  <nav>
    <div class="logo">
      <img src="https://rahimgasmi98.github.io/assets/Picsart_26-04-10_09-55-34-889.png" alt="J3AN Logo" class="logo-img" />
    </div>

    <div class="nav-center" onclick="document.getElementById('mapOverlay').classList.add('active')">
      <div class="search-icon">🔍</div>
      <div>
        <div class="search-text">استكشف الأماكن</div>
        <div class="search-sub">مطاعم · كافيهات · مشويات</div>
      </div>
    </div>
  </nav>

  <!-- ══════ Map Overlay ══════ -->
  <div class="map-overlay" id="mapOverlay">
    <div class="map-header">
      <h2>🗺️ خريطة الأماكن</h2>
      <button class="map-close-btn" onclick="document.getElementById('mapOverlay').classList.remove('active')">✕</button>
    </div>
    <iframe src="/map" loading="lazy" title="خريطة الأماكن"></iframe>
  </div>

  <!-- ══════ Popup Details ══════ -->
  <div class="details-modal" id="detailsModal" aria-hidden="true">
    <div class="details-backdrop" id="detailsBackdrop"></div>
    <div class="details-dialog" role="dialog" aria-modal="true" aria-labelledby="detailsTitle">
      <button class="details-close" id="detailsClose" aria-label="إغلاق">✕</button>
      <h3 class="details-title" id="detailsTitle">تفاصيل المطعم</h3>
      <div class="details-list">
        <div>⭐ <b>التقييم:</b> <span id="detailsRating">-</span></div>
        <div>🍽️ <b>النوع:</b> <span id="detailsType">-</span></div>
        <div>💳 <b>السعر:</b> <span id="detailsPrice">-</span></div>
      </div>
      <button class="details-map-btn" id="goToMapBtn">الذهاب إلى الخريطة</button>
    </div>
  </div>

  <!-- ══════ Categories ══════ -->
  <div class="categories-bar">
    <div class="cat-list">
      <div class="cat-item active" onclick="filterCategory(this,'all')"><span class="cat-icon">🔥</span><span class="cat-label">الكل</span></div>
      <div class="cat-item" onclick="filterCategory(this,'fast')"><span class="cat-icon">🍔</span><span class="cat-label">مأكولات سريعة</span></div>
      <div class="cat-item" onclick="filterCategory(this,'restaurant')"><span class="cat-icon">🍽️</span><span class="cat-label">مطاعم</span></div>
      <div class="cat-item" onclick="filterCategory(this,'grill')"><span class="cat-icon">🥩</span><span class="cat-label">مشويات</span></div>
      <div class="cat-item" onclick="filterCategory(this,'cafe')"><span class="cat-icon">☕</span><span class="cat-label">كافيهات</span></div>
      <div class="cat-item" onclick="filterCategory(this,'pizza')"><span class="cat-icon">🍕</span><span class="cat-label">بيتزا</span></div>
      <div class="cat-item" onclick="filterCategory(this,'seafood')"><span class="cat-icon">🐟</span><span class="cat-label">مأكولات بحرية</span></div>
      <div class="cat-item" onclick="filterCategory(this,'sweets')"><span class="cat-icon">🍰</span><span class="cat-label">حلويات</span></div>
    </div>
  </div>

  <div class="content" id="content">
    <!-- احتفظت بالأقسام والكروت كما هي -->
    <!-- (يمكنك لصق نفس أقسامك الحالية هنا كما هي إذا كانت عندك نسخة أطول) -->
  </div>

  <footer>
    <div>MADE WITH ❤️ BY <span>GASMI ABDERRAHIM</span> — © 2025</div>
    <a href="/support" class="support-link">🛟 SUPPORT</a>
  </footer>

  <script>
    function filterCategory(el, cat) {
      document.querySelectorAll('.cat-item').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      document.querySelectorAll('.section-row').forEach(section => {
        const cats = section.dataset.category.split(',');
        if (cat === 'all' || cats.includes(cat)) {
          section.style.display = '';
          section.style.animation = 'fadeIn .3s ease';
        } else {
          section.style.display = 'none';
        }
      });
    }

    const modal = document.getElementById('detailsModal');
    const backdrop = document.getElementById('detailsBackdrop');
    const closeBtn = document.getElementById('detailsClose');
    const titleEl = document.getElementById('detailsTitle');
    const ratingEl = document.getElementById('detailsRating');
    const typeEl = document.getElementById('detailsType');
    const priceEl = document.getElementById('detailsPrice');
    const goToMapBtn = document.getElementById('goToMapBtn');

    function openModal(data) {
      titleEl.textContent = data.name || 'مطعم';
      ratingEl.textContent = data.rating || '-';
      typeEl.textContent = data.type || '-';
      priceEl.textContent = data.price || '-';
      modal.classList.add('active');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.remove('active');
      modal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    backdrop.addEventListener('click', closeModal);
    closeBtn.addEventListener('click', closeModal);

    goToMapBtn.addEventListener('click', () => {
      closeModal();
      window.location.href = '/map';
    });

    // popup لقسم "اقتراحات لك" فقط
    const recommendationSection = document.querySelector('.section-row[data-category="all,restaurant"]');
    if (recommendationSection) {
      recommendationSection.querySelectorAll('.place-card').forEach(card => {
        card.addEventListener('click', function (e) {
          if (e.target.closest('.card-fav')) return;

          const name = this.querySelector('.card-name')?.textContent?.trim() || '-';
          const rating = this.querySelector('.card-rating')?.textContent?.replace('★', '').trim() || '-';
          const type = this.querySelector('.card-type')?.textContent?.trim() || '-';
          const price = this.querySelector('.card-price')?.textContent?.trim() || '-';

          openModal({ name, rating, type, price });
        });
      });
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        document.getElementById('mapOverlay').classList.remove('active');
        closeModal();
      }
    });
  </script>
</body>
</html>
