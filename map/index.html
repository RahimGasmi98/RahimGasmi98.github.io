<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>J3AN Map — Google Maps Style</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root{
      --card:#fff;
      --text:#1f2937;
      --muted:#6b7280;
      --line:rgba(0,0,0,.1);
      --green:#16a34a;
      --blue:#2563eb;
      --danger:#dc2626;
      --shadow:0 8px 20px rgba(0,0,0,.12);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;font-family:'Cairo',sans-serif;overflow:hidden;background:#f3f4f6}
    #map{width:100%;height:100%}

    .topbar{
      position:fixed;top:10px;left:10px;right:10px;z-index:20;
      display:flex;align-items:center;gap:8px;
    }
    .btn, .gps-btn{
      width:40px;height:40px;border:none;border-radius:10px;cursor:pointer;
      background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
      font-size:18px;color:#111827;flex-shrink:0;
    }
    .search{
      flex:1;display:flex;align-items:center;gap:8px;
      background:#fff;border:1px solid var(--line);border-radius:10px;
      padding:8px 10px;box-shadow:var(--shadow);
    }
    .search input{
      width:100%;border:none;outline:none;background:transparent;
      font-size:13px;font-family:'Cairo',sans-serif;color:var(--text);
    }

    .filters{
      position:fixed;top:60px;left:10px;right:10px;z-index:20;
      display:flex;gap:6px;overflow:auto;padding-bottom:2px;scrollbar-width:none;
    }
    .filters::-webkit-scrollbar{display:none}
    .chip{
      border:none;cursor:pointer;white-space:nowrap;
      background:#fff;border:1px solid var(--line);
      border-radius:999px;padding:7px 12px;font-size:11px;font-weight:700;
      color:#374151;box-shadow:0 3px 10px rgba(0,0,0,.08);
    }
    .chip.active{background:#111827;color:#fff;border-color:#111827}

    .counter{
      position:fixed;left:10px;bottom:10px;z-index:20;
      background:#fff;border:1px solid var(--line);border-radius:10px;
      padding:6px 10px;font-size:11px;color:var(--muted);box-shadow:var(--shadow);
    }

    .toast{
      position:fixed;top:102px;left:50%;z-index:30;
      transform:translateX(-50%) translateY(-8px);
      background:#fff;border:1px solid var(--line);border-radius:10px;
      padding:8px 12px;font-size:12px;box-shadow:var(--shadow);
      opacity:0;pointer-events:none;transition:.2s;
      max-width:calc(100% - 24px);white-space:nowrap;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    .mini{
      min-width:250px;max-width:300px;padding:8px 2px 2px;
      font-family:'Cairo',sans-serif;
    }
    .mini h4{font-size:14px;color:#111827;margin-bottom:2px}
    .mini .type{font-size:11px;color:#6b7280;margin-bottom:6px}
    .mini .row{
      display:flex;align-items:center;justify-content:space-between;
      font-size:11px;padding:4px 0;border-top:1px solid rgba(0,0,0,.06);
    }
    .status{
      font-size:10px;font-weight:800;border-radius:999px;padding:2px 8px;border:1px solid transparent;
    }
    .status.open{color:#15803d;background:rgba(22,163,74,.1);border-color:rgba(22,163,74,.25)}
    .status.closed{color:var(--danger);background:rgba(220,38,38,.08);border-color:rgba(220,38,38,.24)}

    .rate{
      margin-top:7px;padding:7px;border-radius:8px;
      border:1px solid rgba(0,0,0,.08);background:#f8fafc;
    }
    .ri{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:10.5px}
    .lbl{width:88px;color:#475569;flex-shrink:0}
    .bw{flex:1;height:5px;border-radius:999px;background:#e5e7eb;overflow:hidden}
    .b{height:100%;background:linear-gradient(90deg,#22c55e,#84cc16)}
    .n{width:30px;text-align:left;font-size:10px;font-weight:800;color:#111827}

    .popup-actions{
      display:flex;gap:6px;margin-top:7px;
    }
    .pa{
      flex:1;border:none;border-radius:8px;cursor:pointer;
      padding:7px 8px;font-size:10.5px;font-weight:800;color:#fff;
      font-family:'Cairo',sans-serif;
    }
    .pa.details{background:linear-gradient(135deg,#16a34a,#15803d)}
    .pa.route{background:linear-gradient(135deg,#3b82f6,#2563eb)}
  </style>
</head>
<body>

  <div class="topbar">
    <button class="btn" id="backBtn">←</button>
    <div class="search">
      <span>🔍</span>
      <input id="searchInput" placeholder="ابحث عن مط��م أو نوع..." />
    </div>
    <button class="gps-btn" id="gpsBtn">📍</button>
  </div>

  <div class="filters" id="filters">
    <button class="chip active" data-cat="all">الكل</button>
    <button class="chip" data-cat="grill">🥩 مشاوي</button>
    <button class="chip" data-cat="seafood">🐟 بحري</button>
    <button class="chip" data-cat="fast">🍔 سريع</button>
    <button class="chip" data-cat="pizza">🍕 بيتزا</button>
    <button class="chip" data-cat="cafe">☕ كافيه</button>
  </div>

  <div class="counter" id="counter"></div>
  <div class="toast" id="toast"></div>
  <div id="map"></div>

  <script>
    let map, infoWindow, directionsService, directionsRenderer;
    let userMarker = null;
    let userPos = null;
    let markers = [];
    let selectedCategory = "all";

    const restaurants = [
      {id:1, name:"مطعم واد مديني", type:"مشاوي وأطباق تقليدية", cat:"grill", lat:36.8788, lng:6.9013, rating:8.8, cleanliness:8.7, price:8.9, quality:9.1, serviceSpeed:8.4, status:"open"},
      {id:2, name:"Le Phare Chez Louiza", type:"مأكولات بحرية", cat:"seafood", lat:36.8810, lng:6.9100, rating:9.0, cleanliness:9.1, price:8.2, quality:9.3, serviceSpeed:8.6, status:"open"},
      {id:3, name:"مطعم نيو داي", type:"بيتزا ووجبات سريعة", cat:"pizza", lat:36.8752, lng:6.9045, rating:8.5, cleanliness:8.3, price:9.1, quality:8.6, serviceSpeed:8.7, status:"open"},
      {id:4, name:"مطعم الريف", type:"مشاوي عائلية", cat:"grill", lat:36.8730, lng:6.9110, rating:8.7, cleanliness:8.6, price:8.4, quality:9.0, serviceSpeed:8.3, status:"open"},
      {id:5, name:"كافيه لا فيستا", type:"كافيه وحلويات", cat:"cafe", lat:36.8802, lng:6.9038, rating:8.3, cleanliness:8.9, price:8.5, quality:8.2, serviceSpeed:8.0, status:"open"},
      {id:6, name:"مطعم البهجة", type:"وجبات سريعة", cat:"fast", lat:36.8820, lng:6.9070, rating:8.2, cleanliness:8.1, price:9.2, quality:8.3, serviceSpeed:8.4, status:"open"},
      {id:7, name:"مطعم الساحل", type:"أطباق محلية", cat:"grill", lat:36.8695, lng:6.9060, rating:8.4, cleanliness:8.5, price:8.8, quality:8.6, serviceSpeed:8.1, status:"closed"}
    ];

    const toastEl = document.getElementById("toast");
    const counterEl = document.getElementById("counter");
    const searchInput = document.getElementById("searchInput");

    function toast(msg){
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastEl._t);
      toastEl._t = setTimeout(()=>toastEl.classList.remove("show"), 2300);
    }

    function bw(v){ return Math.max(0, Math.min(100, (v / 10) * 100)); }

    function popupHTML(r){
      return `
        <div class="mini">
          <h4>${r.name}</h4>
          <div class="type">${r.type}</div>
          <div class="row"><span>التقييم العام</span><strong>⭐ ${r.rating}</strong></div>
          <div class="row"><span>الحالة</span><span class="status ${r.status === 'open' ? 'open' : 'closed'}">${r.status === 'open' ? 'مفتوح' : 'مغلق'}</span></div>

          <div class="rate">
            <div class="ri"><span class="lbl">النظافة</span><span class="bw"><span class="b" style="width:${bw(r.cleanliness)}%"></span></span><span class="n">${r.cleanliness}</span></div>
            <div class="ri"><span class="lbl">السعر</span><span class="bw"><span class="b" style="width:${bw(r.price)}%"></span></span><span class="n">${r.price}</span></div>
            <div class="ri"><span class="lbl">الجودة</span><span class="bw"><span class="b" style="width:${bw(r.quality)}%"></span></span><span class="n">${r.quality}</span></div>
            <div class="ri"><span class="lbl">الخدمة والسرعة</span><span class="bw"><span class="b" style="width:${bw(r.serviceSpeed)}%"></span></span><span class="n">${r.serviceSpeed}</span></div>
          </div>

          <div class="popup-actions">
            <button class="pa details" onclick="openGoogleMaps(${r.lat},${r.lng})">فتح في Google Maps</button>
            <button class="pa route" onclick="drawRoute(${r.id})">أقصر طريق</button>
          </div>
        </div>
      `;
    }

    function filteredRestaurants(){
      const q = searchInput.value.trim().toLowerCase();
      return restaurants.filter(r => {
        const byText = r.name.toLowerCase().includes(q) || r.type.toLowerCase().includes(q);
        const byCat = selectedCategory === "all" || r.cat === selectedCategory;
        return byText && byCat;
      });
    }

    function clearMarkers(){
      markers.forEach(m => m.setMap(null));
      markers = [];
    }

    function renderMarkers(){
      const list = filteredRestaurants();
      clearMarkers();

      list.forEach(r => {
        const marker = new google.maps.Marker({
          position: { lat:r.lat, lng:r.lng },
          map,
          title: r.name
        });

        marker.addListener("click", () => {
          infoWindow.setContent(popupHTML(r));
          infoWindow.open(map, marker);
        });

        markers.push(marker);
      });

      counterEl.innerHTML = `تم العثور على <b>${list.length}</b> مكان`;
    }

    function initMap(){
      map = new google.maps.Map(document.getElementById("map"), {
        center: { lat:36.8765, lng:6.9065 },
        zoom: 14,
        mapTypeId: "roadmap", // ستايل Google Maps العادي
        streetViewControl: false,
        fullscreenControl: false,
        mapTypeControl: false
      });

      infoWindow = new google.maps.InfoWindow();

      directionsService = new google.maps.DirectionsService();
      directionsRenderer = new google.maps.DirectionsRenderer({
        map,
        suppressMarkers: false,
        polylineOptions: {
          strokeColor: "#2563eb",
          strokeOpacity: 0.9,
          strokeWeight: 5
        }
      });

      renderMarkers();
      bindEvents();
    }

    function bindEvents(){
      searchInput.addEventListener("input", renderMarkers);

      document.querySelectorAll(".chip").forEach(chip => {
        chip.addEventListener("click", () => {
          document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
          chip.classList.add("active");
          selectedCategory = chip.dataset.cat;
          renderMarkers();
        });
      });

      document.getElementById("gpsBtn").addEventListener("click", () => {
        if(!navigator.geolocation){ toast("المتصفح لا يدعم GPS"); return; }

        navigator.geolocation.getCurrentPosition(pos => {
          userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          map.panTo(userPos);
          map.setZoom(15);

          if(userMarker) userMarker.setMap(null);
          userMarker = new google.maps.Marker({
            position: userPos,
            map,
            title: "موقعي الحالي",
            icon: {
              path: google.maps.SymbolPath.CIRCLE,
              scale: 8,
              fillColor: "#2563eb",
              fillOpacity: 1,
              strokeColor: "#ffffff",
              strokeWeight: 3
            }
          });

          toast("تم تحديد موقعك بنجاح");
        }, () => toast("تعذر تحديد الموقع"), { enableHighAccuracy:true, timeout:10000 });
      });

      document.getElementById("backBtn").addEventListener("click", () => {
        if (window.parent && window.parent !== window) {
          try {
            window.parent.document.getElementById("mapOverlay").classList.remove("active");
            return;
          } catch(e){}
        }
        history.back();
      });
    }

    window.openGoogleMaps = function(lat, lng){
      window.open(`https://www.google.com/maps?q=${lat},${lng}`, "_blank");
    };

    window.drawRoute = function(id){
      if(!userPos){ toast("فعّل GPS أولاً"); return; }
      const r = restaurants.find(x => x.id === id);
      if(!r) return;

      directionsService.route({
        origin: userPos,
        destination: { lat:r.lat, lng:r.lng },
        travelMode: google.maps.TravelMode.DRIVING
      }, (result, status) => {
        if(status === "OK"){
          directionsRenderer.setDirections(result);
          toast("تم رسم الطريق");
        } else {
          toast("تعذر رسم الطريق");
        }
      });
    };

    window.initMap = initMap;
  </script>

  <!-- بدّل YOUR_API_KEY بمفتاحك -->
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap"></script>
</body>
</html>
