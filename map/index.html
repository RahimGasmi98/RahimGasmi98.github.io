<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>J3AN Map — خريطة المطاعم</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root{
      --bg:#f8fafc;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --line:rgba(0,0,0,.08);
      --primary:#16a34a;
      --primary-dark:#15803d;
      --blue:#2563eb;
      --danger:#dc2626;
      --shadow:0 4px 14px rgba(0,0,0,.08);
      --radius:10px;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{
      width:100%;height:100%;
      font-family:'Cairo',sans-serif;
      background:var(--bg);
      color:var(--text);
      overflow:hidden;
      -webkit-tap-highlight-color:transparent;
    }

    #map{width:100%;height:100dvh}

    .leaflet-control-attribution,.leaflet-control-zoom{display:none!important}
    .leaflet-div-icon{background:transparent!important;border:none!important}

    /* Top */
    .topbar{
      position:fixed;top:10px;left:10px;right:10px;z-index:1200;
      display:flex;align-items:center;gap:8px;
    }
    .back-btn{
      width:40px;height:40px;border:none;cursor:pointer;
      border-radius:10px;background:var(--card);border:1px solid var(--line);
      box-shadow:var(--shadow);font-size:18px;color:#111827;
      flex-shrink:0;
    }
    .search-box{
      flex:1;display:flex;align-items:center;gap:8px;
      background:var(--card);border:1px solid var(--line);
      border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);
    }
    .search-box span{font-size:14px;color:#64748b}
    .search-box input{
      width:100%;border:none;outline:none;background:transparent;
      font-family:'Cairo',sans-serif;font-size:13px;color:var(--text);
    }
    .search-box input::placeholder{color:#9ca3af}

    /* Floating */
    .fab{
      position:fixed;z-index:1200;right:10px;
      width:42px;height:42px;border:none;cursor:pointer;
      border-radius:50%;background:var(--card);
      border:1px solid var(--line);box-shadow:var(--shadow);
      display:grid;place-items:center;color:#475569;
    }
    .fab.gps{bottom:78px}
    .fab.style{bottom:126px;font-size:17px}
    .fab svg{
      width:19px;height:19px;fill:none;stroke:currentColor;
      stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
    }

    .counter{
      position:fixed;left:10px;bottom:10px;z-index:1200;
      background:var(--card);border:1px solid var(--line);
      border-radius:10px;padding:5px 10px;font-size:11px;color:var(--muted);
      box-shadow:var(--shadow);
    }
    .counter b{color:var(--primary-dark)}

    .credit{
      position:fixed;right:10px;bottom:10px;z-index:1200;
      background:var(--card);border:1px solid var(--line);
      border-radius:10px;padding:5px 10px;font-size:10px;color:#6b7280;
      box-shadow:var(--shadow);user-select:none;
    }
    .credit b{color:var(--primary-dark)}

    .toast{
      position:fixed;top:60px;left:50%;z-index:2000;
      transform:translateX(-50%) translateY(-10px);
      background:#fff;border:1px solid var(--line);border-radius:9px;
      box-shadow:var(--shadow);padding:8px 14px;font-size:12px;
      opacity:0;pointer-events:none;transition:.2s;
      max-width:calc(100% - 24px);
      white-space:nowrap;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast.ok{border-color:rgba(22,163,74,.35)}
    .toast.err{border-color:rgba(220,38,38,.35)}

    /* Marker classic */
    .pin{
      width:28px;height:28px;border-radius:50% 50% 50% 0;
      background:linear-gradient(135deg,var(--primary),var(--primary-dark));
      transform:rotate(-45deg);
      box-shadow:0 2px 8px rgba(22,163,74,.28);
      display:grid;place-items:center;
    }
    .pin i{transform:rotate(45deg);font-style:normal;font-size:12px;color:#fff}

    .user-dot{
      width:16px;height:16px;border-radius:50%;
      background:var(--blue);border:3px solid #fff;
      box-shadow:0 0 0 5px rgba(37,99,235,.18),0 2px 8px rgba(0,0,0,.12);
    }

    /* Popup */
    .leaflet-popup-content-wrapper{
      background:#fff;border:1px solid var(--line);
      border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.10);padding:0;
    }
    .leaflet-popup-tip{background:#fff;border:1px solid var(--line)}
    .leaflet-popup-content{margin:0!important}
    .leaflet-popup-close-button{
      color:#94a3b8!important;left:8px!important;right:auto!important;top:5px!important;
    }

    .mini{min-width:220px;max-width:270px;padding:10px}
    .mini-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .mini-icon{
      width:32px;height:32px;border-radius:8px;display:grid;place-items:center;
      background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;
      font-size:15px;flex-shrink:0;
    }
    .mini-name{font-size:12.5px;font-weight:800;color:#111827;line-height:1.35}
    .mini-type{font-size:10px;color:var(--muted)}
    .mini-row{
      display:flex;align-items:center;justify-content:space-between;
      font-size:11px;color:#334155;padding:4px 0;
    }
    .mini-row + .mini-row{border-top:1px solid var(--line)}
    .status{
      font-size:10px;font-weight:800;border-radius:999px;padding:2px 8px;
      border:1px solid transparent;
    }
    .status.open{color:#15803d;background:rgba(22,163,74,.10);border-color:rgba(22,163,74,.24)}
    .status.closed{color:var(--danger);background:rgba(220,38,38,.08);border-color:rgba(220,38,38,.22)}
    .dist{margin-top:3px;font-size:10px;color:#2563eb}

    .btn{
      width:100%;border:none;border-radius:8px;cursor:pointer;
      padding:7px 9px;margin-top:7px;color:#fff;
      font-family:'Cairo',sans-serif;font-size:11px;font-weight:800;
    }
    .btn.more{background:linear-gradient(135deg,var(--primary),var(--primary-dark))}
    .btn.route{background:linear-gradient(135deg,#3b82f6,#2563eb)}

    /* Overlay + sheet */
    .overlay{
      position:fixed;inset:0;z-index:1500;background:rgba(0,0,0,.30);
      opacity:0;pointer-events:none;transition:.2s;
    }
    .overlay.active{opacity:1;pointer-events:auto}

    .sheet{
      position:fixed;left:0;right:0;bottom:0;z-index:1600;
      background:#fff;border-top:1px solid var(--line);
      border-radius:16px 16px 0 0;max-height:85dvh;
      transform:translateY(100%);transition:.28s;
      display:flex;flex-direction:column;overflow:hidden;
    }
    .sheet.active{transform:translateY(0)}
    .sheet-handle{padding:9px 0 6px;display:flex;justify-content:center}
    .sheet-handle i{width:36px;height:4px;border-radius:999px;background:#cbd5e1}
    .sheet-close{
      position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:50%;
      border:1px solid var(--line);background:#f1f5f9;color:#64748b;cursor:pointer;
    }
    .sheet-body{overflow:auto;padding:0 12px 18px}

    .sh-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .sh-icon{
      width:44px;height:44px;border-radius:10px;display:grid;place-items:center;
      color:#fff;font-size:20px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));
      flex-shrink:0;
    }
    .sh-name{font-size:16px;font-weight:800;color:#111827}
    .sh-type{font-size:12px;color:var(--muted)}
    .sh-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:3px;font-size:11px}
    .chip{
      padding:2px 8px;border-radius:999px;font-size:10px;font-weight:800;border:1px solid transparent
    }
    .chip.open{color:#15803d;background:rgba(22,163,74,.10);border-color:rgba(22,163,74,.24)}
    .chip.closed{color:var(--danger);background:rgba(220,38,38,.08);border-color:rgba(220,38,38,.22)}
    .chip.dist{color:#1d4ed8;background:rgba(37,99,235,.09);border-color:rgba(37,99,235,.25)}

    .sec{margin-top:13px}
    .sec h4{font-size:13px;color:#0f172a;margin-bottom:7px}
    .desc{font-size:12px;color:#4b5563;line-height:1.8}

    .grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
    .info{
      background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:8px;
    }
    .info .k{font-size:10px;color:#94a3b8}
    .info .v{font-size:12px;font-weight:700;color:#0f172a;margin-top:2px}
    .full{grid-column:1/-1}

    .photos{display:flex;gap:8px;overflow:auto;padding-bottom:5px;scrollbar-width:none}
    .photos::-webkit-scrollbar{display:none}
    .photos img{
      width:136px;height:88px;object-fit:cover;border-radius:9px;border:1px solid var(--line);flex-shrink:0;
    }

    .comment{
      background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:9px;margin-bottom:7px;
    }
    .comment .h{font-size:11px;font-weight:700;color:#111827;margin-bottom:3px}
    .comment .t{font-size:11.5px;color:#4b5563;line-height:1.7}

    /* Route bar */
    .routebar{
      position:fixed;left:50%;bottom:10px;z-index:1700;
      transform:translateX(-50%) translateY(90px);
      background:#fff;border:1px solid rgba(37,99,235,.30);
      border-radius:10px;box-shadow:var(--shadow);
      padding:8px 10px;display:flex;align-items:center;gap:8px;
      transition:.25s;max-width:calc(100% - 20px);
    }
    .routebar.show{transform:translateX(-50%) translateY(0)}
    .routebar .txt{font-size:11px;color:#1e3a8a}
    .routebar .x{
      width:26px;height:26px;border-radius:50%;border:1px solid var(--line);
      background:#f1f5f9;cursor:pointer;
    }

    @media (max-width:600px){
      .topbar{top:8px;left:8px;right:8px}
      .back-btn{width:37px;height:37px}
      .search-box{padding:6px 9px}
      .search-box input{font-size:12px}
      .fab{width:38px;height:38px;right:8px}
      .fab.gps{bottom:74px}
      .fab.style{bottom:118px}
      .counter,.credit{bottom:8px}
      .counter{left:8px;font-size:10px}
      .credit{right:8px;font-size:8.8px}
    }
  </style>
</head>

      center: [36.8765, 6.9065],
      zoom: isMobile ? 13.5 : 14,
      zoomControl: false,
      attributionControl: false
    });

    // كلاسيكي مريح
    var classicLayer = L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      subdomains: "abcd",
      maxZoom: 19
    });

    // ملوّن عادي
    var colorLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19
    });

    classicLayer.addTo(map);
    var isClassic = true;

    // =========================
    // Elements
    // =========================
    var searchInput = document.getElementById("searchInput");
    var counterEl = document.getElementById("counter");
    var toastEl = document.getElementById("toast");
    var overlay = document.getElementById("overlay");
    var sheet = document.getElementById("sheet");
    var sheetBody = document.getElementById("sheetBody");
    var sheetClose = document.getElementById("sheetClose");
    var gpsBtn = document.getElementById("gpsBtn");
    var styleBtn = document.getElementById("styleBtn");
    var routeBar = document.getElementById("routeBar");
    var routeTxt = document.getElementById("routeTxt");
    var routeClose = document.getElementById("routeClose");

    // =========================
    // Helpers
    // =========================
    function toast(msg, type) {
      toastEl.className = "toast " + (type || "");
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastEl._t);
      toastEl._t = setTimeout(function() {
        toastEl.classList.remove("show");
      }, 2600);
    }

    function stars(n) {
      var v = Math.round(n / 2);
      return "★".repeat(v) + "☆".repeat(5 - v);
    }

    function calcDistance(lat1, lng1, lat2, lng2) {
      var R = 6371;
      var dLat = (lat2 - lat1) * Math.PI / 180;
      var dLng = (lng2 - lng1) * Math.PI / 180;
      var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLng/2) * Math.sin(dLng/2);
      var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function formatDist(km) {
      if (km < 1) return Math.round(km * 1000) + " م";
      return km.toFixed(1) + " كم";
    }

    // =========================
    // Markers
    // =========================
    var markersLayer = L.layerGroup().addTo(map);
    var currentList = restaurants.slice();

    function pinIcon(icon) {
      return L.divIcon({
        className: "",
        iconSize: [28, 28],
        iconAnchor: [14, 28],
        popupAnchor: [0, -24],
        html: '<div class="pin"><i>' + icon + '</i></div>'
      });
    }

    function popupHTML(r) {
      var distHTML = "";
      if (userLat !== null) {
        var d = calcDistance(userLat, userLng, r.lat, r.lng);
        distHTML = '<div class="dist">📍 ' + formatDist(d) + ' منك</div>';
      }

      return '' +
        '<div class="mini">' +
          '<div class="mini-head">' +
            '<div class="mini-icon">' + r.icon + '</div>' +
            '<div>' +
              '<div class="mini-name">' + r.name + '</div>' +
              '<div class="mini-type">' + r.type + '</div>' +
              distHTML +
            '</div>' +
          '</div>' +
          '<div class="mini-row"><span>التقييم</span><strong>⭐ ' + r.rating + '</strong></div>' +
          '<div class="mini-row"><span>الحالة</span><span class="status ' + (r.status === "open" ? "open" : "closed") + '">' + (r.status === "open" ? "مفتوح" : "مغلق") + '</span></div>' +
          '<button class="btn more" onclick="openDetails(' + r.id + ')">عرض التفاصيل</button>' +
          '<button class="btn route" onclick="drawRoute(' + r.id + ')">أقصر طريق</button>' +
        '</div>';
    }

    function renderMarkers(list) {
      markersLayer.clearLayers();
      list.forEach(function(r) {
        L.marker([r.lat, r.lng], { icon: pinIcon(r.icon) })
          .addTo(markersLayer)
          .bindPopup(popupHTML(r));
      });
      counterEl.innerHTML = "تم العثور على <b>" + list.length + "</b> مكان";
    }

    // =========================
    // Sheet
    // =========================
    function openSheet(r) {
      var distChip = "";
      if (userLat !== null) {
        var d = calcDistance(userLat, userLng, r.lat, r.lng);
        distChip = '<span class="chip dist">📍 ' + formatDist(d) + '</span>';
      }

      var photos = (r.photos || []).map(function(p) {
        return '<img src="' + p + '" alt="">';
      }).join("");

      var comments = (r.comments || []).map(function(c, i) {
        var names = ["أحمد", "سارة", "يوسف", "ليلى", "كريم", "هدى", "عمر", "نادية"];
        return '<div class="comment"><div class="h">👤 ' + names[i % names.length] + '</div><div class="t">' + c + '</div></div>';
      }).join("");

      sheetBody.innerHTML =
        '<div class="sh-head">' +
          '<div class="sh-icon">' + r.icon + '</div>' +
          '<div>' +
            '<div class="sh-name">' + r.name + '</div>' +
            '<div class="sh-type">' + r.type + '</div>' +
            '<div class="sh-meta">' +
              '<span>⭐ ' + r.rating + ' (' + stars(r.rating) + ')</span>' +
              '<span class="chip ' + (r.status === "open" ? "open" : "closed") + '">' + (r.status === "open" ? "مفتوح" : "مغلق") + '</span>' +
              distChip +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="sec"><h4>نبذة</h4><div class="desc">' + r.description + '</div></div>' +

        '<div class="sec"><h4>معلومات</h4>' +
          '<div class="grid">' +
            '<div class="info"><div class="k">ساعات العمل</div><div class="v">' + r.hours + '</div></div>' +
            '<div class="info"><div class="k">الهاتف</div><div class="v">' + r.phone + '</div></div>' +
            '<div class="info full"><div class="k">العنوان</div><div class="v">' + r.address + '</div></div>' +
          '</div>' +
        '</div>' +

        '<div class="sec"><h4>صور</h4><div class="photos">' + photos + '</div></div>' +

        '<div class="sec"><h4>تعليقات الزوار</h4>' + comments + '</div>';

      overlay.classList.add("active");
      sheet.classList.add("active");
    }

    function closeSheet() {
      overlay.classList.remove("active");
      sheet.classList.remove("active");
    }

    overlay.addEventListener("click", closeSheet);
    sheetClose.addEventListener("click", closeSheet);

    window.openDetails = function(id) {
      var r = restaurants.find(function(x){ return x.id === id; });
      if (!r) return;
      map.closePopup();
      openSheet(r);
    };

    // =========================
    // Search
    // =========================
    searchInput.addEventListener("input", function(e) {
      var q = e.target.value.trim().toLowerCase();
      currentList = restaurants.filter(function(r) {
        return r.name.toLowerCase().includes(q) || r.type.toLowerCase().includes(q);
      });
      renderMarkers(currentList);
    });

    // =========================
    // GPS
    // =========================
    var userLat = null, userLng = null, userMarker = null, gpsWatchId = null;
    var userCircle = null;

    function updateUserLocation(pos) {
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      var accuracy = pos.coords.accuracy || 30;

      var icon = L.divIcon({
        className: "",
        iconSize: [16, 16],
        iconAnchor: [8, 8],
        html: '<div class="user-dot"></div>'
      });

      if (!userMarker) {
        userMarker = L.marker([userLat, userLng], { icon: icon, zIndexOffset: 1000 }).addTo(map);
        userCircle = L.circle([userLat, userLng], {
          radius: accuracy,
          color: "rgba(37,99,235,.28)",
          fillColor: "rgba(37,99,235,.08)",
          fillOpacity: 1,
          weight: 1
        }).addTo(map);
      } else {
        userMarker.setLatLng([userLat, userLng]);
        userCircle.setLatLng([userLat, userLng]);
        userCircle.setRadius(accuracy);
      }

      renderMarkers(currentList);
    }

    function onGPSError(err) {
      if (err.code === 1) toast("يرجى السماح بالوصول للموقع", "err");
      else if (err.code === 2) toast("تعذر تحديد الموقع", "err");
      else toast("انتهت مهلة تحديد الموقع", "err");
    }

    gpsBtn.addEventListener("click", function() {
      if (!navigator.geolocation) {
        toast("المتصفح لا يدعم GPS", "err");
        return;
      }

      if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
        if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
        if (userCircle) { map.removeLayer(userCircle); userCircle = null; }
        userLat = null; userLng = null;
        clearRoute();
        renderMarkers(currentList);
        toast("تم إيقاف تتبع الموقع");
        return;
      }

      toast("جاري تحديد موقعك...");
      navigator.geolocation.getCurrentPosition(function(pos) {
        updateUserLocation(pos);
        map.flyTo([pos.coords.latitude, pos.coords.longitude], 15, { duration: 0.8 });
        toast("تم تحديد موقعك ب��جاح", "ok");

        gpsWatchId = navigator.geolocation.watchPosition(updateUserLocation, onGPSError, {
          enableHighAccuracy: true,
          maximumAge: 10000,
          timeout: 15000
        });
      }, onGPSError, {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      });
    });

    // =========================
    // Route
    // =========================
    var routeLine = null, routeShadow = null;

    function clearRoute() {
      if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
      if (routeShadow) { map.removeLayer(routeShadow); routeShadow = null; }
      routeBar.classList.remove("show");
    }

    routeClose.addEventListener("click", clearRoute);

    window.drawRoute = function(id) {
      if (userLat === null) {
        toast("فعّل GPS أولاً ثم اخ��ر مطعم", "err");
        return;
      }

      var r = restaurants.find(function(x){ return x.id === id; });
      if (!r) return;

      clearRoute();
      map.closePopup();
      toast("جاري حساب أقصر طريق...");

      var url = "https://router.project-osrm.org/route/v1/driving/" +
        userLng + "," + userLat + ";" + r.lng + "," + r.lat +
        "?overview=full&geometries=geojson";

      fetch(url)
        .then(function(res){ return res.json(); })
        .then(function(data){
          if (!data.routes || !data.routes.length) {
            toast("لم يتم العثور على طريق", "err");
            return;
          }

          var route = data.routes[0];
          var coords = route.geometry.coordinates.map(function(c){ return [c[1], c[0]]; });

          routeShadow = L.polyline(coords, {
            color: "rgba(0,0,0,.10)",
            weight: 8,
            opacity: .5
          }).addTo(map);

          routeLine = L.polyline(coords, {
            color: "#2563eb",
            weight: 4.5,
            opacity: .9,
            lineCap: "round",
            lineJoin: "round"
          }).addTo(map);

          map.fitBounds(routeLine.getBounds().pad(0.14), { animate: true, duration: 0.7 });

          var km = route.distance / 1000;
          var min = Math.round(route.duration / 60);
          routeTxt.innerHTML = "إلى <b>" + r.name + "</b> · " +
            (km < 1 ? Math.round(km * 1000) + " م" : km.toFixed(1) + " كم") +
            " · ~" + min + " د";

          routeBar.classList.add("show");
          toast("تم رسم الطريق", "ok");
        })
        .catch(function() {
          toast("خطأ أثناء حساب الطريق", "err");
        });
    };

    // =========================
    // Style switch
    // =========================
    styleBtn.addEventListener("click", function() {
      if (isClassic) {
        map.removeLayer(classicLayer);
        colorLayer.addTo(map);
        toast("تم التحويل إلى نمط ملوّن", "ok");
      } else {
        map.removeLayer(colorLayer);
        classicLayer.addTo(map);
        toast("تم التحويل إلى النمط الكلاسيكي", "ok");
      }
      isClassic = !isClassic;
    });

    // Back
    document.getElementById("backBtn").addEventListener("click", function() {
      if (window.parent && window.parent !== window) {
        try {
          window.parent.document.getElementById("mapOverlay").classList.remove("active");
          return;
        } catch(e){}
      }
      history.back();
    });

    // init
    renderMarkers(currentList);
  </script>
</body>
</html>
