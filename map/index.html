<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>J3AN Map — خريطة الأماكن</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root{
      --bg:#ffffff;
      --card:rgba(255,255,255,.92);
      --text:#1e293b;
      --muted:#64748b;
      --line:rgba(15,23,42,.08);
      --primary:#22c55e;
      --primary-dark:#16a34a;
      --blue:#3b82f6;
      --shadow:0 8px 30px rgba(15,23,42,.10);
      --radius:14px;
    }

    *{margin:0;padding:0;box-sizing:border-box}
    html,body{
      width:100%;height:100%;
      font-family:'Cairo',sans-serif;
      background:var(--bg);color:var(--text);
      overflow:hidden;
      -webkit-tap-highlight-color:transparent;
    }

    #map{
      width:100%;
      height:100dvh;
      background:#eaf2ff;
    }

    .leaflet-control-attribution,
    .leaflet-control-zoom{display:none!important}
    .leaflet-div-icon{background:transparent!important;border:none!important}

    /* ===== Top Bar ===== */
    .topbar{
      position:fixed;top:12px;left:12px;right:12px;z-index:1200;
      display:flex;align-items:center;gap:10px;
    }

    .back-btn{
      width:42px;height:42px;border:none;border-radius:12px;
      background:var(--card);backdrop-filter:blur(10px);
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      display:grid;place-items:center;
      font-size:18px;cursor:pointer;color:#0f172a;
      transition:.2s transform,.2s filter;
      flex-shrink:0;
    }
    .back-btn:hover{filter:brightness(1.03)}
    .back-btn:active{transform:scale(.95)}

    .search-box{
      flex:1;
      display:flex;align-items:center;gap:8px;
      background:var(--card);backdrop-filter:blur(10px);
      border:1px solid var(--line);
      border-radius:12px;
      padding:8px 12px;
      box-shadow:var(--shadow);
    }
    .search-box span{font-size:14px;opacity:.8}
    .search-box input{
      width:100%;border:none;outline:none;background:transparent;
      font-family:'Cairo',sans-serif;font-size:13px;color:var(--text);
    }
    .search-box input::placeholder{color:#94a3b8}

    /* ===== Floating Buttons ===== */
    .fab{
      position:fixed;z-index:1200;
      width:44px;height:44px;border:none;border-radius:50%;
      background:var(--card);backdrop-filter:blur(10px);
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      display:grid;place-items:center;
      cursor:pointer;color:#475569;
      transition:.2s;
    }
    .fab:hover{color:var(--blue);border-color:rgba(59,130,246,.3)}
    .fab:active{transform:scale(.94)}
    .fab.gps{right:12px;bottom:88px}
    .fab.layers{right:12px;bottom:136px;font-size:18px}

    .fab svg{
      width:20px;height:20px;
      fill:none;stroke:currentColor;stroke-width:2;
      stroke-linecap:round;stroke-linejoin:round;
    }

    /* ===== Counter + Credit ===== */
    .counter{
      position:fixed;left:12px;bottom:12px;z-index:1200;
      background:var(--card);backdrop-filter:blur(10px);
      border:1px solid var(--line);
      border-radius:10px;
      padding:6px 10px;
      font-size:11px;color:var(--muted);
      box-shadow:var(--shadow);
    }
    .counter b{color:var(--primary-dark)}

    .credit{
      position:fixed;right:12px;bottom:12px;z-index:1200;
      background:var(--card);backdrop-filter:blur(10px);
      border:1px solid var(--line);
      border-radius:10px;
      padding:6px 10px;
      font-size:10px;color:#64748b;
      box-shadow:var(--shadow);
      user-select:none;
    }
    .credit b{color:var(--primary-dark)}

    /* ===== Toast ===== */
    .toast{
      position:fixed;top:64px;left:50%;z-index:2000;
      transform:translateX(-50%) translateY(-14px);
      background:rgba(255,255,255,.96);
      border:1px solid var(--line);
      border-radius:10px;
      padding:8px 14px;
      font-size:12px;
      box-shadow:var(--shadow);
      opacity:0;pointer-events:none;transition:.25s;
      max-width:calc(100% - 24px);
      white-space:nowrap;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast.ok{border-color:rgba(34,197,94,.35)}
    .toast.err{border-color:rgba(239,68,68,.35)}

    /* ===== Marker ===== */
    .pin-wrap{position:relative}
    .pin-pulse{
      width:34px;height:34px;border-radius:50%;
      background:rgba(34,197,94,.25);
      animation:pulse 2.2s ease-out infinite;
      position:absolute;top:0;left:0;
    }
    .pin{
      width:34px;height:34px;border-radius:50% 50% 50% 0;
      background:linear-gradient(135deg,var(--primary),var(--primary-dark));
      transform:translate(0,0) rotate(-45deg);
      box-shadow:0 6px 18px rgba(34,197,94,.35), inset 0 0 0 2px rgba(255,255,255,.35);
      display:grid;place-items:center;
      position:relative;
    }
    .pin i{
      transform:rotate(45deg);
      font-style:normal;font-size:14px;
      filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));
    }
    @keyframes pulse{
      0%{transform:scale(.8);opacity:.55}
      100%{transform:scale(2.4);opacity:0}
    }

    /* ===== User Marker ===== */
    .user-dot{
      width:16px;height:16px;border-radius:50%;
      background:var(--blue);border:3px solid #fff;
      box-shadow:0 0 0 6px rgba(59,130,246,.2), 0 2px 10px rgba(0,0,0,.14);
    }
    .user-pulse{
      position:absolute;width:16px;height:16px;border-radius:50%;
      background:rgba(59,130,246,.22);animation:userPulse 2s ease-out infinite;
    }
    @keyframes userPulse{
      0%{transform:scale(1);opacity:.7}
      100%{transform:scale(3.4);opacity:0}
    }

    /* ===== Popup Card ===== */
    .leaflet-popup-content-wrapper{
      background:#fff;border:1px solid var(--line);
      border-radius:14px;box-shadow:var(--shadow);padding:0;
    }
    .leaflet-popup-tip{background:#fff;border:1px solid var(--line)}
    .leaflet-popup-content{margin:0!important}
    .leaflet-popup-close-button{
      top:6px!important;left:8px!important;right:auto!important;
      color:#94a3b8!important;font-size:18px!important;
    }

    .mini{
      min-width:230px;max-width:270px;
      padding:12px;
    }
    .mini-head{display:flex;gap:9px;align-items:center;margin-bottom:8px}
    .mini-icon{
      width:34px;height:34px;border-radius:10px;
      display:grid;place-items:center;font-size:16px;
      color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-dark));
      box-shadow:0 6px 14px rgba(34,197,94,.25);
      flex-shrink:0;
    }
    .mini h4{font-size:13px;line-height:1.35;color:#0f172a}
    .mini small{font-size:10px;color:var(--muted)}
    .mini-row{
      display:flex;justify-content:space-between;align-items:center;
      font-size:11px;color:#334155;padding:4px 0;
    }
    .mini-row+.mini-row{border-top:1px solid var(--line)}
    .status{
      font-size:10px;font-weight:800;border-radius:999px;padding:2px 8px;
    }
    .status.open{color:#16a34a;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25)}
    .status.closed{color:#dc2626;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25)}
    .dist{
      margin-top:4px;font-size:10px;color:#2563eb
    }
    .btn{
      width:100%;border:none;border-radius:9px;
      margin-top:8px;padding:8px 10px;cursor:pointer;
      font-family:'Cairo',sans-serif;font-size:11.5px;font-weight:800;
      color:#fff;
      transition:.15s transform,.2s filter;
    }
    .btn:active{transform:scale(.97)}
    .btn-more{background:linear-gradient(135deg,var(--primary),var(--primary-dark))}
    .btn-route{background:linear-gradient(135deg,#3b82f6,#2563eb)}

    /* ===== Bottom Sheet ===== */
    .overlay{
      position:fixed;inset:0;z-index:1500;
      background:rgba(15,23,42,.28);
      backdrop-filter:blur(2px);
      opacity:0;pointer-events:none;transition:.25s;
    }
    .overlay.active{opacity:1;pointer-events:auto}

    .sheet{
      position:fixed;left:0;right:0;bottom:0;z-index:1600;
      background:linear-gradient(180deg,#fff 0%,#f8fafc 100%);
      border-top:1px solid var(--line);
      border-radius:18px 18px 0 0;
      max-height:86dvh;
      transform:translateY(100%);
      transition:transform .35s cubic-bezier(.22,.8,.2,1);
      display:flex;flex-direction:column;overflow:hidden;
    }
    .sheet.active{transform:translateY(0)}
    .sheet-handle{padding:10px 0 6px;display:flex;justify-content:center}
    .sheet-handle i{width:38px;height:4px;border-radius:999px;background:#cbd5e1}
    .sheet-close{
      position:absolute;top:10px;left:12px;
      width:32px;height:32px;border-radius:50%;
      border:1px solid var(--line);background:#f1f5f9;cursor:pointer;
      display:grid;place-items:center;color:#64748b;font-size:16px;
    }
    .sheet-body{
      padding:0 14px 20px;overflow:auto;
      -webkit-overflow-scrolling:touch;
    }

    .sh-head{display:flex;gap:10px;align-items:center;margin-bottom:12px}
    .sh-icon{
      width:46px;height:46px;border-radius:12px;
      background:linear-gradient(135deg,var(--primary),var(--primary-dark));
      display:grid;place-items:center;font-size:22px;color:#fff;flex-shrink:0;
    }
    .sh-name{font-size:17px;font-weight:800;color:#0f172a}
    .sh-type{font-size:12px;color:var(--muted)}
    .sh-meta{margin-top:2px;font-size:11px;color:#475569;display:flex;gap:8px;flex-wrap:wrap}
    .chip{
      display:inline-flex;align-items:center;gap:4px;
      padding:2px 8px;border-radius:999px;font-size:10px;font-weight:800;
      border:1px solid transparent;
    }
    .chip.ok{color:#16a34a;background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.25)}
    .chip.no{color:#dc2626;background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.25)}
    .chip.dist{color:#2563eb;background:rgba(59,130,246,.08);border-color:rgba(59,130,246,.22)}

    .sec{margin-top:14px}
    .sec h5{font-size:13px;margin-bottom:8px;color:#0f172a}
    .desc{font-size:12px;line-height:1.8;color:#64748b}

    .grid{
      display:grid;grid-template-columns:1fr 1fr;gap:8px;
    }
    .card{
      background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px;
    }
    .card .k{font-size:10px;color:#94a3b8}
    .card .v{font-size:12px;font-weight:700;color:#0f172a;margin-top:2px}
    .full{grid-column:1/-1}

    .photos{
      display:flex;gap:8px;overflow:auto;padding-bottom:4px;
      scrollbar-width:none;
    }
    .photos::-webkit-scrollbar{display:none}
    .photos img{
      width:140px;height:90px;object-fit:cover;border-radius:10px;
      border:1px solid var(--line);flex-shrink:0;
    }

    .comment{
      background:#fff;border:1px solid var(--line);border-radius:10px;
      padding:10px;margin-bottom:7px;
    }
    .comment .t{font-size:11.5px;color:#475569;line-height:1.7}
    .comment .h{font-size:11px;font-weight:700;color:#0f172a;margin-bottom:4px}

    /* ===== Route Bar ===== */
    .routebar{
      position:fixed;left:50%;bottom:12px;z-index:1700;
      transform:translateX(-50%) translateY(90px);
      transition:.3s;
      display:flex;align-items:center;gap:10px;
      background:rgba(255,255,255,.96);
      border:1px solid rgba(59,130,246,.26);
      border-radius:12px;
      padding:9px 12px;
      box-shadow:var(--shadow);
      max-width:calc(100% - 24px);
    }
    .routebar.show{transform:translateX(-50%) translateY(0)}
    .routebar .txt{font-size:11px;color:#1e3a8a;line-height:1.6}
    .routebar .x{
      width:28px;height:28px;border-radius:50%;
      border:1px solid var(--line);background:#f1f5f9;cursor:pointer;
    }

    @media (max-width:640px){
      .topbar{top:8px;left:8px;right:8px}
      .back-btn{width:38px;height:38px}
      .search-box{padding:6px 10px}
      .search-box input{font-size:12px}
      .fab{width:40px;height:40px}
      .fab.gps{right:8px;bottom:78px}
      .fab.layers{right:8px;bottom:124px}
      .counter,.credit{bottom:8px}
      .counter{left:8px;font-size:10px}
      .credit{right:8px;font-size:9px}
    }
  </style>
</head>
<body>

  <!-- Top -->
  <div class="topbar">
    <button class="back-btn" id="backBtn" title="رجوع">←</button>
    <div class="search-box">
      <span>🔍</span>
      <input id="searchInput" type="text" placeholder="ابحث عن مطعم أو نوع الأكل..." autocomplete="off" />
    </div>
  </div>

  <!-- Floating -->
  <button class="fab layers" id="styleBtn" title="تبديل شكل الخريطة">🗺️</button>
  <button class="fab gps" id="gpsBtn" title="موقعي الحالي">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
      <circle cx="12" cy="12" r="8"></circle>
    </svg>
  </button>

  <div class="counter" id="counter"></div>
  <div class="credit">MADE BY <b>GASMI ABDERRAHIM</b></div>
  <div class="toast" id="toast"></div>

  <div class="routebar" id="routeBar">
    <div class="txt" id="routeTxt"></div>
    <button class="x" id="routeClose">✕</button>
  </div>

  <div id="map"></div>

  <div class="overlay" id="overlay"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"><i></i></div>
    <button class="sheet-close" id="sheetClose">✕</button>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ===== Data =====
    var restaurants = [
      {
        id: 1, lat: 36.8788, lng: 6.9013,
        name: "مطعم واد مديني", type: "مشاوي وأطباق تقليدية", icon: "🔥",
        description: "مطعم بإطلالة بانورامية جميلة، مشهور بالمشاوي الطازجة والأجواء العائلية الهادئة.",
        rating: 8.8, status: "open", hours: "11:00 – 23:00", phone: "0555 12 34 56",
        address: "طريق واد مديني، سكيكدة",
        photos: [
          "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600&h=400&fit=crop",
          "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=600&h=400&fit=crop",
          "https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=600&h=400&fit=crop"
        ],
        comments: ["مشاوي ممتازة!", "الإطلالة رائعة جداً."]
      },
      {
        id: 2, lat: 36.8810, lng: 6.9100,
        name: "Le Phare Chez Louiza", type: "مأكولات بحرية", icon: "🐟",
        description: "مطعم قريب من البحر، يقدم أسماك ومأكولات بحرية طازجة يومياً.",
        rating: 9.0, status: "open", hours: "12:00 – 23:30", phone: "0555 98 76 54",
        address: "الواجهة البحرية، سكيكدة",
        photos: [
          "https://images.unsplash.com/photo-1590846406792-0adc7f938f1d?w=600&h=400&fit=crop",
          "https://images.unsplash.com/photo-1559339352-11d035aa65de?w=600&h=400&fit=crop"
        ],
        comments: ["سمك طازج ولذيذ.", "من أفضل مطاعم البحر."]
      },
      {
        id: 3, lat: 36.8752, lng: 6.9045,
        name: "مطعم نيو داي", type: "بيتزا ووجبات سريعة", icon: "🍕",
        description: "بيتزا بعجينة طازجة وخدمة سريعة، مناسب للعائلات والأصدقاء.",
        rating: 8.5, status: "open", hours: "10:00 – 00:00", phone: "0555 11 22 33",
        address: "شارع محمود نفير، سكيكدة",
        photos: [
          "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=600&h=400&fit=crop"
        ],
        comments: ["أفضل بيتزا!", "الأسعار ممتازة."]
      },
      {
        id: 4, lat: 36.8695, lng: 6.9060,
        name: "مطعم الساحل", type: "أطباق محلية تقليدية", icon: "🍖",
        description: "أكلات جزائرية تقليدية، طواجن ومشاوي ومخبوزات يومية.",
        rating: 8.4, status: "closed", hours: "11:30 – 22:00", phone: "0555 33 22 11",
        address: "وسط المدينة، سكيكدة",
        photos: [
          "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=600&h=400&fit=crop"
        ],
        comments: ["طعم تقليدي جميل."]
      }
    ];

    // ===== Map =====
    var isMobile = window.matchMedia("(max-width:640px)").matches;
    var map = L.map("map", {
      center: [36.8765, 6.9065],
      zoom: isMobile ? 13.5 : 14,
      zoomControl: false,
      attributionControl: false
    });

    // ستايل ملوّن عادي
    var streetLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 });
    // ستايل بديل
    var lightLayer  = L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", { subdomains: "abcd", maxZoom: 19 });
    streetLayer.addTo(map);

    var usingStreet = true;
    document.getElementById("styleBtn").addEventListener("click", function(){
      if (usingStreet){
        map.removeLayer(streetLayer); lightLayer.addTo(map);
        toast("تم التبديل إلى نمط فاتح", "ok");
      }else{
        map.removeLayer(lightLayer); streetLayer.addTo(map);
        toast("تم التبديل إلى النمط الملوّن", "ok");
      }
      usingStreet = !usingStreet;
    });

    // ===== UI refs =====
    var counterEl = document.getElementById("counter");
    var toastEl = document.getElementById("toast");
    var searchInput = document.getElementById("searchInput");
    var overlay = document.getElementById("overlay");
    var sheet = document.getElementById("sheet");
    var sheetBody = document.getElementById("sheetBody");
    var sheetClose = document.getElementById("sheetClose");

    var gpsBtn = document.getElementById("gpsBtn");
    var routeBar = document.getElementById("routeBar");
    var routeTxt = document.getElementById("routeTxt");
    var routeClose = document.getElementById("routeClose");

    // ===== Helpers =====
    function toast(msg, type){
      toastEl.className = "toast " + (type || "");
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastEl._t);
      toastEl._t = setTimeout(function(){ toastEl.classList.remove("show"); }, 2500);
    }

    function stars(v){
      var n = Math.round(v/2);
      return "★".repeat(n) + "☆".repeat(5-n);
    }

    function calcDistance(lat1,lng1,lat2,lng2){
      var R = 6371;
      var dLat = (lat2-lat1)*Math.PI/180;
      var dLng = (lng2-lng1)*Math.PI/180;
      var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
              Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
              Math.sin(dLng/2)*Math.sin(dLng/2);
      var c = 2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
      return R*c;
    }

    function formatDist(km){
      return km < 1 ? Math.round(km*1000) + " م" : km.toFixed(1) + " كم";
    }

    function openSheet(r){
      var distChip = "";
      if (userLat !== null){
        var d = calcDistance(userLat, userLng, r.lat, r.lng);
        distChip = '<span class="chip dist">📍 ' + formatDist(d) + '</span>';
      }

      var photos = (r.photos || []).map(function(p){ return '<img src="'+p+'" alt="">'; }).join("");
      var comments = (r.comments || []).map(function(c){
        return '<div class="comment"><div class="h">💬 تعليق</div><div class="t">'+c+'</div></div>';
      }).join("");

      sheetBody.innerHTML =
        '<div class="sh-head">' +
          '<div class="sh-icon">' + r.icon + '</div>' +
          '<div>' +
            '<div class="sh-name">' + r.name + '</div>' +
            '<div class="sh-type">' + r.type + '</div>' +
            '<div class="sh-meta">' +
              '<span>⭐ ' + r.rating + ' (' + stars(r.rating) + ')</span>' +
              '<span class="chip ' + (r.status === "open" ? "ok" : "no") + '">' + (r.status === "open" ? "مفتوح" : "مغلق") + '</span>' +
              distChip +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="sec"><h5>نبذة</h5><div class="desc">' + r.description + '</div></div>' +

        '<div class="sec"><h5>معلومات</h5>' +
          '<div class="grid">' +
            '<div class="card"><div class="k">ساعات العمل</div><div class="v">' + r.hours + '</div></div>' +
            '<div class="card"><div class="k">الهاتف</div><div class="v">' + r.phone + '</div></div>' +
            '<div class="card full"><div class="k">العنوان</div><div class="v">' + r.address + '</div></div>' +
          '</div>' +
        '</div>' +

        '<div class="sec"><h5>صور</h5><div class="photos">' + photos + '</div></div>' +

        '<div class="sec"><h5>آراء الزوار</h5>' + comments + '</div>';

      overlay.classList.add("active");
      sheet.classList.add("active");
    }

    function closeSheet(){
      overlay.classList.remove("active");
      sheet.classList.remove("active");
    }

    overlay.addEventListener("click", closeSheet);
    sheetClose.addEventListener("click", closeSheet);

    // ===== Marker render =====
    var markersLayer = L.layerGroup().addTo(map);
    var currentList = restaurants.slice();

    function pinIcon(icon){
      return L.divIcon({
        className: "",
        iconSize: [34,34],
        iconAnchor: [17,34],
        popupAnchor: [0,-30],
        html:
          '<div class="pin-wrap">' +
            '<div class="pin-pulse"></div>' +
            '<div class="pin"><i>' + icon + '</i></div>' +
          '</div>'
      });
    }

    function popupHTML(r){
      var distHtml = "";
      if (userLat !== null){
        var d = calcDistance(userLat, userLng, r.lat, r.lng);
        distHtml = '<div class="dist">📍 ' + formatDist(d) + ' منك</div>';
      }

      return '' +
      '<div class="mini">' +
        '<div class="mini-head">' +
          '<div class="mini-icon">' + r.icon + '</div>' +
          '<div><h4>' + r.name + '</h4><small>' + r.type + '</small>' + distHtml + '</div>' +
        '</div>' +
        '<div class="mini-row"><span>التقييم</span><b>⭐ ' + r.rating + '</b></div>' +
        '<div class="mini-row"><span>الحالة</span><span class="status ' + (r.status==="open"?"open":"closed") + '">' + (r.status==="open"?"مفتوح":"مغلق") + '</span></div>' +
        '<button class="btn btn-more" onclick="openDetails(' + r.id + ')">عرض التفاصيل</button>' +
        '<button class="btn btn-route" onclick="drawRoute(' + r.id + ')">أقصر طريق</button>' +
      '</div>';
    }

    function render(list){
      markersLayer.clearLayers();
      list.forEach(function(r){
        var m = L.marker([r.lat, r.lng], { icon: pinIcon(r.icon) }).addTo(markersLayer);
        m.bindPopup(popupHTML(r), { closeButton:true, autoPan:true });
      });
      counterEl.innerHTML = "تم العثور على <b>" + list.length + "</b> مكان";
    }

    window.openDetails = function(id){
      var r = restaurants.find(function(x){ return x.id === id; });
      if (!r) return;
      map.closePopup();
      openSheet(r);
    };

    // ===== Search =====
    searchInput.addEventListener("input", function(e){
      var q = e.target.value.trim().toLowerCase();
      currentList = restaurants.filter(function(r){
        return r.name.toLowerCase().includes(q) || r.type.toLowerCase().includes(q);
      });
      render(currentList);
    });

    // ===== GPS =====
    var userLat = null, userLng = null, userMarker = null, userCircle = null, gpsWatchId = null;

    function updateUser(pos){
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      var acc = pos.coords.accuracy || 30;

      var icon = L.divIcon({
        className:"",
        iconSize:[16,16],
        iconAnchor:[8,8],
        html:'<div class="user-pulse"></div><div class="user-dot"></div>'
      });

      if (!userMarker){
        userMarker = L.marker([userLat,userLng], { icon:icon, zIndexOffset:999 }).addTo(map);
        userCircle = L.circle([userLat,userLng], {
          radius:acc,
          color:"rgba(59,130,246,.3)",
          fillColor:"rgba(59,130,246,.08)",
          fillOpacity:1,
          weight:1
        }).addTo(map);
      }else{
        userMarker.setLatLng([userLat,userLng]);
        userCircle.setLatLng([userLat,userLng]);
        userCircle.setRadius(acc);
      }

      render(currentList);
    }

    function gpsErr(err){
      if (err.code === 1) toast("يرجى السماح بالوصول للموقع", "err");
      else if (err.code === 2) toast("تعذر تحديد الموقع", "err");
      else toast("انتهت مهلة تحديد الموقع", "err");
    }

    gpsBtn.addEventListener("click", function(){
      if (!navigator.geolocation){
        toast("المتصفح لا يدعم GPS", "err");
        return;
      }

      if (gpsWatchId !== null){
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
        if (userMarker){ map.removeLayer(userMarker); userMarker = null; }
        if (userCircle){ map.removeLayer(userCircle); userCircle = null; }
        userLat = null; userLng = null;
        clearRoute();
        render(currentList);
        toast("تم إيقاف تتبع الموقع");
        return;
      }

      toast("جاري تحديد موقعك...");
      navigator.geolocation.getCurrentPosition(function(pos){
        updateUser(pos);
        map.flyTo([pos.coords.latitude, pos.coords.longitude], 15, { duration: 0.8 });
        toast("تم تحديد موقعك بنجاح", "ok");

        gpsWatchId = navigator.geolocation.watchPosition(updateUser, gpsErr, {
          enableHighAccuracy:true, timeout:15000, maximumAge:10000
        });
      }, gpsErr, {
        enableHighAccuracy:true, timeout:10000, maximumAge:0
      });
    });

    // ===== Route (OSRM) =====
    var routeLine = null, routeShadow = null;

    function clearRoute(){
      if (routeLine){ map.removeLayer(routeLine); routeLine = null; }
      if (routeShadow){ map.removeLayer(routeShadow); routeShadow = null; }
      routeBar.classList.remove("show");
    }

    routeClose.addEventListener("click", clearRoute);

    window.drawRoute = function(id){
      if (userLat === null){
        toast("فعّل GPS أولاً ثم اختر مطعم", "err");
        return;
      }

      var r = restaurants.find(function(x){ return x.id === id; });
      if (!r) return;

      clearRoute();
      map.closePopup();
      toast("جاري حساب أقصر طريق...");

      var url = "https://router.project-osrm.org/route/v1/driving/" +
                userLng + "," + userLat + ";" + r.lng + "," + r.lat +
                "?overview=full&geometries=geojson";

      fetch(url)
        .then(function(res){ return res.json(); })
        .then(function(data){
          if (!data.routes || !data.routes.length){
            toast("لم يتم العثور على طريق", "err");
            return;
          }

          var route = data.routes[0];
          var coords = route.geometry.coordinates.map(function(c){ return [c[1], c[0]]; });

          routeShadow = L.polyline(coords, {
            color:"rgba(0,0,0,.12)", weight:9, opacity:.55
          }).addTo(map);

          routeLine = L.polyline(coords, {
            color:"#3b82f6", weight:5, opacity:.9, lineCap:"round", lineJoin:"round"
          }).addTo(map);

          map.fitBounds(routeLine.getBounds().pad(0.14), { animate:true, duration:0.7 });

          var km = route.distance/1000;
          var min = Math.round(route.duration/60);
          routeTxt.innerHTML = "🗺️ إلى <b>" + r.name + "</b> · 📍 " +
            (km < 1 ? Math.round(km*1000) + " م" : km.toFixed(1) + " كم") +
            " · ⏱️ ~" + min + " د";
          routeBar.classList.add("show");
          toast("تم رسم الطريق", "ok");
        })
        .catch(function(){ toast("خطأ أثناء حساب الطريق", "err"); });
    };

    // ===== Back button =====
    document.getElementById("backBtn").addEventListener("click", function(){
      if (window.parent && window.parent !== window) {
        // داخل iframe
        try {
          window.parent.document.getElementById("mapOverlay").classList.remove("active");
          return;
        } catch(e){}
      }
      history.back();
    });

    // init
    render(currentList);
  </script>
</body>
</html>
